name: Release

on:
  push:
    branches:
      - "main"

# Minimal default for all jobs; jobs that need more elevate below.
permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  release:
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}
    needs: install-and-test
    runs-on: ubuntu-latest
    name: "Create a new release & update changelog using semantic-release"
    permissions:
      contents: write # push the release commit + tag to main
      issues: write # @semantic-release/github fail/success issues
      pull-requests: write # @semantic-release/github PR comments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: semantic-release
        run: npx semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}

  publish-to-github-registry:
    needs: release
    if: ${{ contains(needs.release.outputs.new-release-published, 'true') }}
    runs-on: ubuntu-latest
    name: "Releases package to Github Packages registry"
    permissions:
      contents: read
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: "@blastorg"
      - run: npm ci
      - run: npm run build
      - run: npm version ${{ needs.release.outputs.new-release-version }} --no-git-tag-version --no-commit-hooks --allow-same-version
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  publish-to-npm:
    needs: release
    if: ${{ contains(needs.release.outputs.new-release-published, 'true') }}
    runs-on: ubuntu-latest
    name: "Releases package to NPM registry"
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          scope: "@blastorg"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm version ${{ needs.release.outputs.new-release-version }} --no-git-tag-version --no-commit-hooks --allow-same-version
      - run: npm publish
